[workspace]
resolver = "2"
members = [
    "crates/mtg-core",
    "crates/mtg-cards",
    "crates/mtg-ai",
    "crates/mtg-db",
    "crates/mtg-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
mtg-core  = { path = "crates/mtg-core" }
mtg-cards = { path = "crates/mtg-cards" }
mtg-ai    = { path = "crates/mtg-ai" }
mtg-db    = { path = "crates/mtg-db" }

serde      = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror  = "2"
rand       = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
rand_chacha = "0.3"
smallvec   = { version = "1", features = ["serde", "union"] }
rusqlite   = { version = "0.32", features = ["bundled", "serde_json"] }
tokio      = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
axum       = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Só para `WebSocket::split()` em mtg-server (Stream/Sink do axum exigem os
# traits de futures-util em escopo). Mantida no workspace para versão única.
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
